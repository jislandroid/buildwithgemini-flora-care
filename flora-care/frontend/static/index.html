<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FloraCare</title>
<!-- Optional: used only to draw A2UI Icon components. If it can't load (offline/
     corp network), icons fall back to showing their name as text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #2e7d32;
    --accent-dark: #1b5e20;
    --accent-light: #e8f5e9;
    --accent-border: #c8e6c9;
    --bg: #f5f7f5;
    --border: #e2e8e3;
    --text-primary: #1f2937;
    --text-secondary: #4b5563;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    height: 100vh;
    color: var(--text-primary);
  }
  header {
    background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
    color: #fff;
    padding: 0.85rem 1.4rem;
    box-shadow: 0 2px 10px rgba(27, 94, 32, 0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-icon {
    width: 38px;
    height: 38px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }
  .header-title-wrap {
    display: flex;
    flex-direction: column;
  }
  .header-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .header-tagline {
    font-size: 0.75rem;
    color: #c8e6c9;
    font-weight: 400;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-status {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.75rem;
    color: #e8f5e9;
    background: rgba(255, 255, 255, 0.15);
    padding: 0.35rem 0.65rem;
    border-radius: 20px;
  }
  .status-dot {
    width: 7px;
    height: 7px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 6px #4ade80;
  }
  .btn-header-reset {
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.35);
    color: #ffffff;
    border-radius: 20px;
    padding: 0.35rem 0.75rem;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-family: inherit;
    transition: all 0.2s ease;
  }
  .btn-header-reset:hover {
    background: rgba(255, 255, 255, 0.35);
    transform: translateY(-1px);
  }
  .btn-header-reset .material-symbols-outlined {
    font-size: 1.05rem;
    color: #ffffff;
    line-height: 1;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  .welcome-banner {
    background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
    border: 1px solid var(--accent-border);
    border-radius: 16px;
    padding: 1.2rem 1.4rem;
    display: flex;
    gap: 1rem;
    align-items: center;
    color: #2e7d32;
    margin-bottom: 0.5rem;
  }
  .welcome-banner .welcome-icon {
    font-size: 2.2rem;
  }
  .welcome-banner h3 {
    margin: 0 0 0.25rem;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1b5e20;
  }
  .welcome-banner p {
    margin: 0;
    font-size: 0.85rem;
    color: #374151;
    line-height: 1.4;
  }

  /* Dialogue row styling */
  .dialogue-row {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dialogue-row.agent {
    align-self: flex-start;
  }
  .dialogue-row.user {
    align-self: flex-end;
  }
  .dialogue-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1.1rem;
  }
  .dialogue-row.agent .dialogue-avatar {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #c8e6c9;
  }
  .dialogue-row.user .dialogue-avatar {
    background: #1b5e20;
    color: #ffffff;
  }
  .dialogue-content {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .dialogue-row.user .dialogue-content {
    align-items: flex-end;
  }
  .dialogue-meta {
    font-size: 0.75rem;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 0.25rem;
    padding: 0 0.25rem;
  }
  .bubble {
    display: inline-block;
    padding: 0.75rem 1rem;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .dialogue-row.agent .bubble {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 4px 18px 18px 18px;
    color: var(--text-primary);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
  }
  .dialogue-row.user .bubble {
    background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
    color: #ffffff;
    border: none;
    border-radius: 18px 4px 18px 18px;
    box-shadow: 0 2px 10px rgba(46, 125, 50, 0.2);
  }
  .bubble.rich {
    background: transparent !important;
    border: none !important;
    padding: 0 !important;
    max-width: 100%;
    box-shadow: none !important;
    white-space: normal;
  }

  .input-panel {
    border-top: 1px solid var(--border);
    background: #ffffff;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.03);
  }
  .input-inner {
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }
  #prompts {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem 1rem 0.25rem;
    overflow-x: auto;
  }
  .prompt-chip {
    background: #f0fdf4;
    color: var(--accent);
    border: 1px solid #bbf7d0;
    border-radius: 20px;
    padding: 0.45rem 0.9rem;
    font-size: 0.82rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }
  .prompt-chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(46, 125, 50, 0.25);
  }
  form {
    display: flex;
    gap: 0.6rem;
    padding: 0.6rem 1rem 1rem;
    background: transparent;
  }
  input {
    flex: 1;
    padding: 0.75rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    background: #fcfdfc;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    background: #ffffff;
  }
  button {
    padding: 0.75rem 1.3rem;
    border: none;
    border-radius: 24px;
    background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
    color: #ffffff;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button:hover {
    opacity: 0.94;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(46, 125, 50, 0.3);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid #dcfce7;
    border-radius: 14px;
    padding: 1.1rem;
    background: #ffffff;
    box-shadow: 0 3px 12px rgba(46, 125, 50, 0.08);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.6rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.4rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.4; }
  .a2text.a2-h1 { font-size: 1.5rem; font-weight: 700; color: #1b5e20; }
  .a2text.a2-h2 { font-size: 1.25rem; font-weight: 700; color: #1b5e20; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 600; color: #2e7d32; }
  .a2text.a2-h4 { font-size: 1rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: #666; }
  .a2divider { border: none; border-top: 1px solid #dcfce7; margin: 0.5rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 10px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: zoom-in; transition: transform 0.2s ease; }
  .a2img:hover { transform: scale(1.01); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }

  /* --- Typing Indicator --- */
  .typing-indicator {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0.35rem 0.5rem;
    min-height: 24px;
  }
  .typing-indicator span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: typingBounce 1.3s infinite ease-in-out;
  }
  .typing-indicator span:nth-child(1) { animation-delay: 0s; }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* --- Markdown Styles --- */
  .markdown-body {
    line-height: 1.55;
    font-size: 0.95rem;
  }
  .markdown-body p { margin: 0 0 0.5rem; }
  .markdown-body p:last-child { margin-bottom: 0; }
  .markdown-body strong { color: var(--accent-dark); font-weight: 600; }
  .markdown-body code {
    background: #f1f5f2;
    color: #1b5e20;
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    border: 1px solid #dce4de;
  }
  .markdown-body pre {
    background: #202b24;
    color: #e8f5e9;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0.5rem 0;
  }
  .markdown-body pre code {
    background: transparent;
    color: inherit;
    padding: 0;
    border: none;
  }
  .markdown-body ul {
    margin: 0.4rem 0 0.6rem;
    padding-left: 1.25rem;
  }
  .markdown-body li {
    margin-bottom: 0.25rem;
  }

  /* --- Lightbox Modal --- */
  .lightbox {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(10, 20, 14, 0.88);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    cursor: zoom-out;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    object-fit: contain;
    cursor: default;
    animation: zoomModal 0.22s ease-out;
  }
  @keyframes zoomModal {
    from { transform: scale(0.92); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .lightbox-close {
    position: absolute;
    top: 20px;
    right: 28px;
    font-size: 2.2rem;
    color: #ffffff;
    cursor: pointer;
    line-height: 1;
    font-weight: 300;
    transition: opacity 0.2s ease;
  }
  .lightbox-close:hover { opacity: 0.8; }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <div class="header-icon">🌿</div>
    <div class="header-title-wrap">
      <span class="header-title">FloraCare</span>
      <span class="header-tagline">Plant Care & Greenhouse Assistant</span>
    </div>
  </div>
  <div class="header-actions">
    <div class="header-status">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
    <button id="btn-reset" class="btn-header-reset" title="Start a fresh conversation">
      <span class="material-symbols-outlined">restart_alt</span>
      <span>New Chat</span>
    </button>
  </div>
</header>
<div id="log">
  <div class="welcome-banner">
    <div class="welcome-icon">🪴</div>
    <div>
      <h3>Welcome to FloraCare!</h3>
      <p>I'm your intelligent companion for plant care, watering diagnostics, greenhouse advice, and house plant discovery. Try an example below or ask anything!</p>
    </div>
  </div>
</div>
<div class="input-panel">
  <div class="input-inner">
    <div id="prompts">
      <button type="button" class="prompt-chip" data-prompt="How do I care for a Monstera Deliciosa?">🌿 Monstera Care</button>
      <button type="button" class="prompt-chip" data-prompt="When should I water my Snake Plant?">💧 Snake Plant Watering</button>
      <button type="button" class="prompt-chip" data-prompt="Show me low-light house plants">🔍 Low-Light Plants</button>
      <button type="button" class="prompt-chip" data-prompt="How much soil do I need for a 10-inch round pot that is 9 inches deep?">🧪 Pot Soil Calc</button>
      <button type="button" class="prompt-chip" data-prompt="Find plant nurseries near New York, NY">📍 Garden Centers</button>
    </div>
    <form id="form">
      <input id="input" placeholder="Ask about plant care, watering, diseases…" autocomplete="off" autofocus>
      <button>Send</button>
    </form>
  </div>
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
  <img id="lightbox-img" src="" alt="Enlarged plant preview" onclick="event.stopPropagation()">
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
let currentUserId = "web-user-" + Math.random().toString(36).slice(2, 9);

// New Chat / Reset conversation
document.getElementById("btn-reset").addEventListener("click", () => {
  currentUserId = "web-user-" + Math.random().toString(36).slice(2, 9);
  log.innerHTML = `
    <div class="welcome-banner">
      <div class="welcome-icon">🪴</div>
      <div>
        <h3>Welcome to FloraCare!</h3>
        <p>I'm your intelligent companion for plant care, watering diagnostics, greenhouse advice, and house plant discovery. Try an example below or ask anything!</p>
      </div>
    </div>
  `;
});

// Clickable prompts
document.querySelectorAll(".prompt-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    input.value = chip.getAttribute("data-prompt");
    form.requestSubmit();
  });
});

// Lightbox modal helpers
function openLightbox(url) {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("lightbox-img");
  img.src = url;
  lb.classList.add("active");
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeLightbox();
});

// Markdown parser
function renderMarkdown(str) {
  const container = el("div", "markdown-body");
  let html = str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
  // Code blocks ```...```
  html = html.replace(/```([a-z]*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code `...`
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold **...**
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // Italic *...*
  html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // Bullet lists
  html = html.replace(/(?:^|\n)[-*]\s+([^\n]+)/g, '<li class="md-li">$1</li>');
  html = html.replace(/(<li class="md-li">[\s\S]*?<\/li>)/g, '<ul class="md-ul">$1</ul>');
  html = html.replace(/<\/ul>\s*<ul class="md-ul">/g, '');
  // Linebreaks and paragraphs
  html = html.replace(/\n\n+/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  container.innerHTML = '<p>' + html + '</p>';
  return container;
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const isUser = who === "user";
  const row = el("div", "dialogue-row " + who);
  
  const avatar = el("div", "dialogue-avatar");
  avatar.innerHTML = isUser ? '<span class="material-symbols-outlined">person</span>' : '<span class="material-symbols-outlined">eco</span>';
  
  const contentWrapper = el("div", "dialogue-content");
  const meta = el("div", "dialogue-meta", isUser ? "You" : "FloraCare");
  const b = el("div", "bubble");
  
  contentWrapper.appendChild(meta);
  contentWrapper.appendChild(b);
  
  if (isUser) {
    row.appendChild(contentWrapper);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(contentWrapper);
  }
  
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

// A "bound value" is usually {literalString: "..."}; we only support literals.
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

// child ids of a component's props: single `child` and/or `children.explicitList`.
function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

// A2UI icon names are camelCase (locationOn); Material Symbols wants snake_case.
function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;   // missing / cycle guard
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src) && !/^data:image\//i.test(src)) return null;   // only allow safe URLs
      const img = el("img", "a2img");
      img.src = src;
      img.alt = boundStr(props.alt) || "Plant Preview";
      img.title = "Click to enlarge";
      img.onclick = () => openLightbox(src);
      return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;   // unknown component -> skipped (text fallback covers content)
  }
}

// Render one or more A2UI messages (beginRendering + surfaceUpdate) into `container`.
// Returns true if anything was drawn.
function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {   // no valid root given -> infer un-referenced components
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

// Fallback: pull every Text value out of the messages as plain text.
function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.innerHTML = "";   // clear the typing indicator
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(renderMarkdown(textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

// The proxy returns { parts: [{kind:"text",text} | {kind:"a2ui",data}] }.
form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent");
  b.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';
  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, user_id: currentUserId })
    });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
